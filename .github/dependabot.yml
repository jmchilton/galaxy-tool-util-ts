version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Action v2 requires Changesets CLI v3 and renamed workflow inputs.
    ignore:
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
